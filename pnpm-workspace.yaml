packages:
  - apps/*
  - packages/*
catalog:
  '@types/node': 24.19.2
  typescript: 6.0.3
  vitest: 5.0.5
overrides:
  # DSH accepts API 1.10, but its OpenTelemetry SDK peers require <1.10.
  '@opentelemetry/api': 1.9.1
allowBuilds:
  '@deepseek-ai/dsh-subprocess-local': true
  '@google/genai': false
  koffi: true
  node-pty: true
  protobufjs: true
