name: Release

on:
  workflow_call:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/package-npm.mjs
      - name: Build Docker image
        run: |
          docker build --tag beluga:release-candidate \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.licenses=MIT" .
      - name: Verify Docker runtime
        run: |
          docker run --rm --network none \
            --mount "type=bind,src=$PWD/scripts/check-packaged-tools.mjs,dst=/tmp/check-packaged-tools.mjs,readonly" \
            --entrypoint sh beluga:release-candidate -ec '
            test -f LICENSE
            test -f THIRD_PARTY_NOTICES.md
            test -f FLUE-SDK-LICENSE.txt
            test -f /usr/local/LICENSE
            test -f web/index.html
            test -z "$(command -v codex || true)"
            node cli/dist/main.js --help
            node /tmp/check-packaged-tools.mjs cli
          '
      - run: docker image save beluga:release-candidate --output dist/beluga-image.tar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: beluga-npm
          path: dist/npm/*.tgz
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: beluga-container
          path: dist/beluga-image.tar
          if-no-files-found: error

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/desktop run package:windows
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: beluga-windows-x64
          path: apps/desktop/src-tauri/target/release/bundle/windows-x64/
          if-no-files-found: error

  publish-npm:
    needs: [linux, windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: beluga-npm
          path: dist/npm
      - name: Publish npm package
        run: |
          tag=latest
          packages=(dist/npm/*.tgz)
          if [[ "${packages[0]}" == *-preview.*.tgz ]]; then tag=preview; fi
          npm publish "${packages[0]}" --tag "$tag"

  publish:
    needs: publish-npm
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    concurrency:
      group: publish-release
      queue: max
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: beluga-windows-x64
          path: dist/windows
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: beluga-container
          path: dist/container
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: bash scripts/publish-release.sh
