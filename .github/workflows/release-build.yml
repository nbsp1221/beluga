name: Build release candidate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sh scripts/package-linux.sh "$(node -p 'require("./package.json").version')" dist/release
      - name: Verify Linux archive
        run: |
          cd dist/release
          test "$(sha256sum beluga-linux-x64.tar.gz)" = "$(cat beluga-linux-x64.tar.gz.sha256)"
          scratch=$(mktemp -d)
          tar -xzf beluga-linux-x64.tar.gz -C "$scratch"
          cd "$scratch/beluga"
          runtime/bin/node host/dist/main.js --help
          test -f web/index.html
          test -f LICENSE
          test -f runtime/LICENSE
          test -f THIRD_PARTY_NOTICES.md
      - name: Build Docker image
        run: |
          docker build --tag beluga:release-candidate \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.licenses=MIT" .
      - name: Verify Docker runtime
        run: |
          docker run --rm --network none --entrypoint sh beluga:release-candidate -ec '
            test -f LICENSE
            test -f THIRD_PARTY_NOTICES.md
            test -f FLUE-SDK-LICENSE.txt
            test -f /usr/local/LICENSE
            test -f web/index.html
            test -z "$(command -v codex || true)"
            node host/dist/main.js --help
          '
      - run: docker image save beluga:release-candidate --output dist/beluga-image.tar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: beluga-linux-x64
          path: dist/release/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: beluga-container
          path: dist/beluga-image.tar
          if-no-files-found: error

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/desktop run package:windows
      - name: Verify and stage Windows bundles
        shell: pwsh
        run: |
          $assets = "apps/desktop/src-tauri/target/release/bundle/nsis"
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $installer = Get-Item -LiteralPath "$assets/Beluga_${version}_x64-setup.exe" -ErrorAction Stop
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$($installer.FullName).sha256" -Value "$hash  $($installer.Name)" -Encoding ascii
          $zip = "apps/desktop/src-tauri/target/release/bundle/portable/beluga-windows-x64-portable.zip"
          $expected = ((Get-Content -LiteralPath "$zip.sha256") -split '\s+')[0]
          if ((Get-FileHash -LiteralPath $zip).Hash -ne $expected) { throw "Portable ZIP checksum mismatch." }
          $unpacked = Join-Path $env:RUNNER_TEMP "beluga-portable"
          Expand-Archive -LiteralPath $zip -DestinationPath $unpacked
          & "$unpacked/Beluga/beluga-node.exe" "$unpacked/Beluga/host/dist/main.js" --help
          if ($LASTEXITCODE) { throw "Portable Host failed to start." }
          foreach ($file in 'Beluga.exe', 'web/index.html', 'LICENSE', 'NODE-LICENSE.txt', 'FLUE-SDK-LICENSE.txt', 'THIRD_PARTY_NOTICES.md') {
            Get-Item -LiteralPath "$unpacked/Beluga/$file" -ErrorAction Stop | Out-Null
          }
          $staging = New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/beluga-windows-x64"
          Copy-Item -LiteralPath @($installer.FullName, "$($installer.FullName).sha256", $zip, "$zip.sha256") -Destination $staging.FullName
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: beluga-windows-x64
          path: ${{ runner.temp }}/beluga-windows-x64/
          if-no-files-found: error
