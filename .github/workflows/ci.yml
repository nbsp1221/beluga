name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fd-find ripgrep
          fdfind --version
          rg --version
      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $fd = 'fd-v10.5.2-x86_64-pc-windows-msvc'
          $rg = 'ripgrep-15.2.0-x86_64-pc-windows-msvc'
          Set-Location $env:RUNNER_TEMP
          Invoke-WebRequest "https://github.com/sharkdp/fd/releases/download/v10.5.2/$fd.zip" -OutFile "$fd.zip"
          Invoke-WebRequest "https://github.com/BurntSushi/ripgrep/releases/download/15.2.0/$rg.zip" -OutFile "$rg.zip"
          if ((Get-FileHash "$fd.zip").Hash -ne '7edac75ef96b7e9a01ebb251a21ee86ea365a09adcfb865f1ec3346a906153b6') {
            throw 'fd archive checksum mismatch.'
          }
          if ((Get-FileHash "$rg.zip").Hash -ne '71b2fef860abe467217a538ff31de02f5258807c0129f771846f87bd029aafc5') {
            throw 'ripgrep archive checksum mismatch.'
          }
          Expand-Archive "$fd.zip" -DestinationPath .
          Expand-Archive "$rg.zip" -DestinationPath .
          "$env:RUNNER_TEMP\$fd" >> $env:GITHUB_PATH
          "$env:RUNNER_TEMP\$rg" >> $env:GITHUB_PATH
      - name: Verify search tools (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          fd --version
          rg --version
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all -- --check
        if: runner.os == 'Windows'
      - run: pnpm --filter @workspace/desktop prepare:windows
        if: runner.os == 'Windows'
      - run: cargo check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
        if: runner.os == 'Windows'
      - run: pnpm release:check
        if: runner.os == 'Linux'
      - name: Check workflows and release scripts
        if: runner.os == 'Linux'
        env:
          ACTIONLINT_IMAGE: rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo "$ACTIONLINT_IMAGE"
          docker run --rm -v "$PWD:/repo:ro" -w /repo --entrypoint shellcheck "$ACTIONLINT_IMAGE" scripts/*.sh
