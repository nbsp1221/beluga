name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build-release-candidate:
        description: Build release candidate after CI
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all -- --check
        if: runner.os == 'Windows'
      - run: pnpm --filter @workspace/desktop prepare:windows
        if: runner.os == 'Windows'
      - run: cargo check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
        if: runner.os == 'Windows'
      - run: pnpm release:check
        if: runner.os == 'Linux'
      - name: Check workflows and release scripts
        if: runner.os == 'Linux'
        env:
          ACTIONLINT_IMAGE: rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo "$ACTIONLINT_IMAGE"
          docker run --rm -v "$PWD:/repo:ro" -w /repo --entrypoint shellcheck "$ACTIONLINT_IMAGE" scripts/*.sh

  release-plan:
    name: Plan release candidate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.build-release-candidate)
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.version.outputs.changed == 'true' || inputs.build-release-candidate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'push'
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check whether the product version changed
        id: version
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          manifest=apps/cli/package.json
          if ! git cat-file -e "$BEFORE:$manifest"; then
            # The first preview is built manually when the CLI package is introduced.
            exit 0
          fi
          previous=$(git show "$BEFORE:$manifest" | jq -er '.version | strings | select(length > 0)')
          current=$(jq -er '.version | strings | select(length > 0)' "$manifest")
          if [[ "$previous" != "$current" ]]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: [check, release-plan]
    if: needs.release-plan.outputs.build == 'true'
    permissions:
      contents: write
      packages: write
      id-token: write
    uses: ./.github/workflows/release.yml
