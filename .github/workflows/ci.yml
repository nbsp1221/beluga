name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    env:
      ACTIONLINT_IMAGE: rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          require-lockfile: true

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', '.node-version') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', '.node-version') }}-

      - name: Check repository
        run: pnpm check

      - name: Check workflows
        if: runner.os == 'Linux'
        run: docker run --rm -v "$PWD:/repo" -w /repo "$ACTIONLINT_IMAGE" .github/workflows/*.yml

      - name: Check shell scripts
        if: runner.os == 'Linux'
        run: docker run --rm -v "$PWD:/repo" -w /repo --entrypoint shellcheck "$ACTIONLINT_IMAGE" install.sh scripts/*.sh apps/web/bin/beluga apps/web/packaging/*.sh

      - name: Build Linux package
        if: runner.os == 'Linux'
        run: pnpm package

      - name: Verify one-command installation
        if: runner.os == 'Linux'
        run: pnpm test:install

      - name: Upload release files
        if: runner.os == 'Linux' && github.ref_type == 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: beluga-linux-x64
          path: |
            apps/web/dist/beluga-linux-x64.tar.gz
            apps/web/dist/beluga-linux-x64.tar.gz.sha256
            apps/web/dist/install.sh
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
