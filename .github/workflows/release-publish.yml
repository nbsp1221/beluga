name: Publish release

on:
  workflow_dispatch:
    inputs:
      candidate-run:
        description: Successful main CI run ID with release candidate artifacts
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
      packages: write
    steps:
      - name: Verify candidate run
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CANDIDATE_RUN: ${{ inputs.candidate-run }}
        shell: bash
        run: |
          [[ "$CANDIDATE_RUN" =~ ^[0-9]+$ ]]
          run=$(gh api "repos/$GH_REPO/actions/runs/$CANDIDATE_RUN")
          sha=$(jq -er --arg repo "$GH_REPO" '
            select(.conclusion == "success" and .head_branch == "main" and
              .head_repository.full_name == $repo and
              (.event == "push" or .event == "workflow_dispatch") and
              .path == ".github/workflows/ci.yml") | .head_sha
          ' <<< "$run")
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.candidate.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          run-id: ${{ inputs.candidate-run }}
          github-token: ${{ github.token }}
          name: beluga-linux-x64
          path: dist/linux
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          run-id: ${{ inputs.candidate-run }}
          github-token: ${{ github.token }}
          name: beluga-windows-x64
          path: dist/windows
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          run-id: ${{ inputs.candidate-run }}
          github-token: ${{ github.token }}
          name: beluga-container
          path: dist/container
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ steps.candidate.outputs.sha }}
        run: bash scripts/publish-release.sh
